secrets:
  auth_key:
    file: /data/docker/secrets/unifi-collector/auth.key
services:
  unifi-collector:
    build:
     context: ./
     dockerfile: Dockerfile
    container_name: unifi-collector
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 128M
    environment:
      - AUTHKEY_FILE=/run/secrets/auth_key
      - LISTEN_PORT=80
    ports:
      - 30071:80
    volumes:
      - /data/docker/mounts/unifi-collector/cameras.yml:/var/lib/cameras.yml
    secrets:
      - auth_key
    restart: unless-stopped
