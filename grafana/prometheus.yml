global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'nginx-proxy-manager'
    static_configs:
      - targets: ['nginx.emporer.net:9113']
  - job_name: 'glances'
    scrape_interval: 5s
    static_configs:
      - targets: ['192.168.10.4:9091']