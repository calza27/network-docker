services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    ports:
      - '80:80'
      - '82:82' # stats
      - '443:443'
      - '30020:81' # Admin Web UI
    environment:
      TZ: "Australia/Melbourne"
      DISABLE_IPV6: 'true'
    volumes:
      - /data/docker/mounts/nginx/data:/data
      - /data/docker/mounts/nginx/certs:/etc/letsencrypt
    restart: unless-stopped

  nginx-exporter:
    image: 'nginx/nginx-prometheus-exporter:latest'
    container_name: nginx-prometheus-exporter
    restart: unless-stopped
    ports:
      - '9113:9113' # The port Prometheus will actually scrape
    command:
      - '-nginx.scrape-uri=http://nginx-proxy-manager:82/nginx_status'
    depends_on:
      - nginx-proxy-manager